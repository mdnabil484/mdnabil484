<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05030f"/>
      <stop offset="50%" style="stop-color:#0d0828"/>
      <stop offset="100%" style="stop-color:#120535"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="55%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#4a3aff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a3aff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#4a3aff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4a3aff" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <ellipse cx="200" cy="140" rx="180" ry="120" fill="#4a3aff" opacity="0.07" filter="url(#softglow)"/>
  <ellipse cx="1050" cy="100" rx="140" ry="100" fill="#a78bfa" opacity="0.09" filter="url(#softglow)"/>
  <ellipse cx="620" cy="260" rx="300" ry="80" fill="#4a3aff" opacity="0.05" filter="url(#softglow)"/>

  <g opacity="0.35">
    <circle cx="960" cy="70" r="5" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="1020" cy="110" r="4" fill="#4a3aff" filter="url(#glow)"/>
    <circle cx="1080" cy="65" r="6" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="1130" cy="120" r="4" fill="#7c3aed" filter="url(#glow)"/>
    <circle cx="1060" cy="160" r="5" fill="#4a3aff" filter="url(#glow)"/>
    <circle cx="990" cy="180" r="4" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="1110" cy="210" r="4" fill="#7c3aed" filter="url(#glow)"/>
    <circle cx="1160" cy="175" r="5" fill="#4a3aff" filter="url(#glow)"/>
    <line x1="960" y1="70" x2="1020" y2="110" stroke="#4a3aff" stroke-width="1" opacity="0.6"/>
    <line x1="960" y1="70" x2="1080" y2="65" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="1020" y1="110" x2="1080" y2="65" stroke="#4a3aff" stroke-width="1" opacity="0.4"/>
    <line x1="1020" y1="110" x2="1060" y2="160" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <line x1="1080" y1="65" x2="1130" y2="120" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="1130" y1="120" x2="1060" y2="160" stroke="#4a3aff" stroke-width="1" opacity="0.4"/>
    <line x1="1130" y1="120" x2="1160" y2="175" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <line x1="1060" y1="160" x2="990" y2="180" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="1060" y1="160" x2="1110" y2="210" stroke="#4a3aff" stroke-width="1" opacity="0.4"/>
    <line x1="1160" y1="175" x2="1110" y2="210" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
    <line x1="990" y1="180" x2="1110" y2="210" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
  </g>

  <text x="72" y="155" font-family="monospace" font-size="90" fill="#4a3aff" opacity="0.12" font-weight="700">{</text>
  <text x="140" y="82" font-family="monospace" font-size="12" fill="#4a3aff" opacity="0.9" letter-spacing="3">// DATA SCIENTIST &amp; AI ENGINEER</text>
  <text x="138" y="158" font-family="'Segoe UI', Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#nameGrad)" letter-spacing="-1" filter="url(#glow)">MD NABIL</text>
  <rect x="138" y="168" width="420" height="2" rx="1" fill="url(#lineGrad)"/>

  <rect x="138" y="188" width="148" height="28" rx="14" fill="#4a3aff" opacity="0.15"/>
  <rect x="138" y="188" width="148" height="28" rx="14" fill="none" stroke="#4a3aff" stroke-width="1" opacity="0.6"/>
  <text x="212" y="206" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle" letter-spacing="1">Agentic AI</text>

  <rect x="296" y="188" width="138" height="28" rx="14" fill="#7c3aed" opacity="0.12"/>
  <rect x="296" y="188" width="138" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="365" y="206" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">ML / Deep Learning</text>

  <rect x="444" y="188" width="130" height="28" rx="14" fill="#1d4ed8" opacity="0.12"/>
  <rect x="444" y="188" width="130" height="28" rx="14" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="509" y="206" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle" letter-spacing="1">Data Science</text>

  <rect x="138" y="230" width="180" height="24" rx="5" fill="#052e16" opacity="0.8"/>
  <rect x="138" y="230" width="180" height="24" rx="5" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.7"/>
  <circle cx="153" cy="242" r="4" fill="#22c55e" opacity="0.9"/>
  <text x="163" y="247" font-family="monospace" font-size="11" fill="#86efac" letter-spacing="0.5">Open to Opportunities</text>

  <rect x="0" y="274" width="1200" height="3" fill="url(#lineGrad)" opacity="0.6"/>
</svg>
